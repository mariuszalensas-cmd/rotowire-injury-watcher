name: RotoWire Injury Watcher

on:
  schedule:
       # Runs every minute. Note: GitHub's scheduler can lag by a few minutes
   # during high load, so treat this as "roughly every minute," not exact.
   - cron: "* * * * *"
   - cron: "*/2 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run watcher
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: python watch_injuries.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_injuries.json
          git diff --staged --quiet || git commit -m "Update seen injuries state [skip ci]"
          git push
